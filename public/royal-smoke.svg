<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="smokeSilver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f3f6"/>
      <stop offset=".5" stop-color="#aeb8c5"/>
      <stop offset="1" stop-color="#737e8d"/>
    </linearGradient>

    <radialGradient id="cloud">
      <stop offset="0" stop-color="#e3e7ed" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#c1c9d4" stop-opacity=".32"/>
      <stop offset=".72" stop-color="#9ca7b5" stop-opacity=".10"/>
      <stop offset="1" stop-color="#9ca7b5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warm">
      <stop offset="0" stop-color="#d6b15f" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#b99555" stop-opacity=".08"/>
      <stop offset="1" stop-color="#b99555" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity=".72"/>
      <stop offset=".12" stop-color="white" stop-opacity=".42"/>
      <stop offset=".25" stop-color="white" stop-opacity=".13"/>
      <stop offset=".38" stop-color="black"/>
      <stop offset=".62" stop-color="black"/>
      <stop offset=".75" stop-color="white" stop-opacity=".13"/>
      <stop offset=".88" stop-color="white" stop-opacity=".42"/>
      <stop offset="1" stop-color="white" stop-opacity=".72"/>
    </linearGradient>

    <filter id="softSmoke" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .012"
        numOctaves="3" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
        scale="48" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <filter id="fineSmoke" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .018"
        numOctaves="2" seed="27" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28"/>
      <feGaussianBlur stdDeviation="13"/>
    </filter>

    <mask id="softEdges">
      <rect width="1600" height="900" fill="url(#edgeMask)"/>
    </mask>
  </defs>

  <g mask="url(#softEdges)">
    <g fill="url(#cloud)" filter="url(#softSmoke)">
      <ellipse cx="20" cy="160" rx="290" ry="230"/>
      <ellipse cx="90" cy="390" rx="330" ry="250"/>
      <ellipse cx="5" cy="690" rx="300" ry="250"/>
      <ellipse cx="260" cy="270" rx="210" ry="190"/>
      <ellipse cx="230" cy="620" rx="240" ry="230"/>

      <ellipse cx="1580" cy="160" rx="290" ry="230"/>
      <ellipse cx="1510" cy="390" rx="330" ry="250"/>
      <ellipse cx="1595" cy="690" rx="300" ry="250"/>
      <ellipse cx="1340" cy="270" rx="210" ry="190"/>
      <ellipse cx="1370" cy="620" rx="240" ry="230"/>
    </g>

    <g fill="url(#warm)" filter="url(#softSmoke)">
      <ellipse cx="80" cy="490" rx="190" ry="250"/>
      <ellipse cx="1520" cy="490" rx="190" ry="250"/>
    </g>

    <g fill="none" stroke="url(#smokeSilver)" stroke-linecap="round"
       filter="url(#fineSmoke)" opacity=".22">
      <path d="M-100 820 C100 690 30 550 210 440 C330 365 240 210 420 90"
        stroke-width="105"/>
      <path d="M-80 470 C100 390 100 300 250 220 C330 175 340 100 430 40"
        stroke-width="55"/>
      <path d="M1700 820 C1500 690 1570 550 1390 440 C1270 365 1360 210 1180 90"
        stroke-width="105"/>
      <path d="M1680 470 C1500 390 1500 300 1350 220 C1270 175 1260 100 1170 40"
        stroke-width="55"/>
    </g>
  </g>
</svg>
